function teacherMenu(){if(!teacherPin)return teacherGate();id('tabSolo').className='btn';id('tabJoin').className='btn';id('tabHost').className='btn primary';id('form').innerHTML=`<div style="max-width:720px;margin:auto"><h2>Módulo docente</h2><div class="grid2"><button id="newT" class="btn primary" style="min-height:80px">Crear nuevo torneo</button><button id="openT" class="btn" style="min-height:80px">Abrir torneo existente</button></div><div class="notice" style="margin-top:14px;text-align:left">Acceso docente autorizado. La creación y administración de torneos se realiza desde este módulo.</div></div>`;id('newT').onclick=createForm;id('openT').onclick=openForm}
function createForm(){if(!teacherPin)return teacherGate();id('form').innerHTML=`<div class="between" style="max-width:760px;margin:0 auto 12px"><h2>Crear nuevo torneo</h2><button id="back" class="btn">← Volver</button></div><div class="grid2" style="max-width:760px;margin:auto;text-align:left"><div><label class="label">Nombre</label><input id="name" class="input" value="Desafío Industrial"></div><div><label class="label">Tiempo por pregunta</label><select id="time" class="select"><option>20</option><option selected>30</option><option>45</option><option>60</option></select></div><div><label class="label">Máximo participantes</label><select id="max" class="select"><option>12</option><option>16</option><option selected>20</option></select></div><div><label class="label">Equipos</label><select id="teams" class="select"><option value="0">Solo individual</option><option value="4">4 equipos</option><option value="5">5 equipos</option><option value="6">6 equipos</option></select></div></div><button id="create" class="btn primary" style="margin-top:14px">Crear sala</button><div id="msg" class="muted small" style="margin-top:9px"></div>`;id('back').onclick=teacherMenu;id('create').onclick=create}
function openForm(){if(!teacherPin)return teacherGate();id('form').innerHTML=`<div class="between" style="max-width:700px;margin:0 auto 12px"><h2>Abrir torneo existente</h2><button id="back" class="btn">← Volver</button></div><div class="grid2" style="max-width:700px;margin:auto;text-align:left"><div><label class="label">Código de la sala</label><input id="hcode" class="input" maxlength="6" placeholder="ABC123"></div><div><label class="label">PIN de la sala</label><input id="hpin" class="input" maxlength="6" inputmode="numeric" placeholder="6 dígitos" autocomplete="off"></div></div><div class="notice" style="max-width:700px;margin:12px auto;text-align:left">Usa el PIN de 6 dígitos generado cuando se creó este torneo.</div><button id="open" class="btn primary" style="margin-top:14px">Abrir panel docente</button><div id="msg" class="muted small" style="margin-top:9px"></div>`;const q=norm(new URLSearchParams(location.search).get('code'));if(q)id('hcode').value=q;id('back').onclick=teacherMenu;id('open').onclick=openHost}
async function create(){if(busy)return;if(!teacherPin)return teacherGate();busy=true;message('Creando sala…');try{const d=await rpc('torneo_create',{p_teacher_password:teacherPin,p_name:id('name').value,p_max_players:+id('max').value,p_timer_seconds:+id('time').value,p_team_count:+id('teams').value});code=d.code;token=d.hostToken;localStorage.setItem(rk('host',code),token);localStorage.setItem(pk(code),d.hostPin);history.replaceState({},'',`?code=${code}`);await enter()}catch(e){message(e.message)}finally{busy=false}}
async function preview(){const c=norm(id('jcode').value);if(c.length!==6)return message('Código inválido.');try{const d=await rpc('torneo_preview',{p_code:c});message(`${d.name} · ${d.playerCount}/${d.maxPlayers} participantes`);const w=id('teamWrap');if(d.teamsEnabled){w.classList.remove('hidden');id('team').innerHTML=d.teamNames.map(x=>`<option>${esc(x)}</option>`).join('')}else w.classList.add('hidden')}catch(e){message(e.message)}}
async function join(){if(busy)return;const c=norm(id('jcode').value),n=id('nick').value.trim(),w=id('teamWrap'),tm=w.classList.contains('hidden')?null:id('team').value;if(c.length!==6||!n)return message('Escribe código y alias.');busy=true;try{const d=await rpc('torneo_join',{p_code:c,p_nickname:n,p_team_name:tm});code=c;token=d.playerToken;localStorage.setItem(rk('player',c),token);history.replaceState({},'',`?code=${c}`);await enter()}catch(e){message(e.message)}finally{busy=false}}
async function openHost(){if(busy)return;if(!teacherPin)return teacherGate();const c=norm(id('hcode').value),p=id('hpin').value.trim();if(c.length!==6||!/^[0-9]{6}$/.test(p))return message('Escribe el código de sala y el PIN de 6 dígitos.');busy=true;message('Validando…');try{const d=await rpc('torneo_host_login',{p_code:c,p_pin:p});code=c;token=d.hostToken;localStorage.setItem(rk('host',c),token);localStorage.setItem(pk(c),p);history.replaceState({},'',`?code=${c}`);await enter()}catch(e){message(e.message)}finally{busy=false}}
async function enter(){await refresh(true);poll=setInterval(refresh,1200)}async function refresh(first=false){try{state=await rpc('torneo_state',{p_code:code,p_token:token});setConn('En línea','ok');render()}catch(e){setConn('Sincronizando…','bad');if(first)throw e}}
function board(s){return `<table><tr><th>#</th><th>Participante</th><th>Fase</th><th>Total</th><th>Estado</th></tr>${(s.leaderboard||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.nickname)}</td><td>${p.phase_score||0}</td><td>${p.total_score||0}</td><td>${esc(p.status)}</td></tr>`).join('')}</table>`}
function header(s){const t=s.tournament;return `<div class="between"><div><div class="muted small">${s.role==='host'?'PANEL DOCENTE':'PARTICIPANTE'}</div><div class="room">${t.code}</div><div class="muted">${esc(t.name)}</div></div><div class="row"><span class="badge ok">${s.playerCount}/${t.max_players}</span><button id="leave" class="btn">Salir</button></div></div><div class="stats"><div class="stat"><small>Fase</small><strong>${t.current_phase_no||0}/5</strong></div><div class="stat"><small>Pregunta</small><strong>${t.current_question_pos||0}/${s.phase?.question_count||0}</strong></div><div class="stat"><small>Activos</small><strong>${s.activeCount}</strong></div><div class="stat"><small>Estado</small><strong style="font-size:13px">${esc(t.status)}</strong></div></div>`}
function render(){if(!state)return;app.innerHTML=state.role==='host'?hostUI(state):playerUI(state);id('leave').onclick=leave;state.role==='host'?wireHost():wirePlayer();startTick()}
function hostUI(s){const t=s.tournament,q=s.question,live=t.status==='question_active'&&t.question_deadline&&new Date(t.question_deadline)>new Date();let ctl='';if(t.status==='lobby')ctl=`<button data-act="start_phase" class="btn primary" ${s.playerCount<2?'disabled':''}>Iniciar clasificatoria</button>`;else if(t.status==='phase_complete')ctl='<button data-act="start_phase" class="btn primary">Iniciar siguiente fase</button>';else if(t.status==='finished')ctl='<span class="badge gold">Torneo finalizado</span>';else if(t.status==='cancelled')ctl='<span class="badge bad">Torneo cancelado</span>';else if(live&&s.answerCount<s.activeCount)ctl=`<button class="btn" disabled>Pregunta en curso · ${s.answerCount}/${s.activeCount}</button>`;else if(s.phase&&t.current_question_pos>=s.phase.question_count)ctl='<button data-act="close_phase" class="btn success">Cerrar fase y clasificar</button>';else ctl=`<button data-act="start_question" class="btn primary">${t.current_question_pos?'Siguiente pregunta':'Primera pregunta'}</button>`;const qhtml=q?`<section class="panel" style="margin-top:12px"><div class="between"><span class="badge gold">Nivel ${q.level} · ${esc(q.category)}</span><span id="timer" class="timer">--</span></div><div class="q">${esc(q.q)}</div><div class="answers">${q.options.map((o,i)=>`<div class="ans">${'ABCD'[i]}. ${esc(o)}</div>`).join('')}</div><p class="muted small">Respuestas: ${s.answerCount}/${s.activeCount}</p></section>`:'';return `<section class="panel">${header(s)}<div class="notice"><b>Acceso docente desde otro dispositivo</b><br>Código: <b>${t.code}</b> · PIN: <b>${esc(localStorage.getItem(pk(t.code))||'No guardado')}</b></div><div class="row" style="margin-top:12px">${ctl}${!['finished','cancelled'].includes(t.status)?'<button id="cancel" class="btn danger">Cancelar torneo</button>':''}<span id="hm" class="muted small"></span></div></section>${qhtml}<section class="panel" style="margin-top:12px"><h3>Clasificación</h3>${board(s)}</section>`}
function playerUI(s){const t=s.tournament,p=s.me,q=s.question,live=t.status==='question_active'&&t.question_deadline&&new Date(t.question_deadline)>new Date();let body;if(t.status==='cancelled')body='<section class="panel"><h2>Torneo cancelado</h2></section>';else if(p.status==='eliminated')body='<section class="panel"><h2>Participación finalizada</h2></section>';else if(p.status==='champion')body='<section class="panel"><h1>🏆 ¡Campeón!</h1></section>';else if(!q||!live)body='<section class="panel"><h2>Esperando al docente</h2><p class="muted">La pantalla se actualizará automáticamente.</p></section>';else body=`<section class="panel"><div class="between"><span class="badge gold">Nivel ${q.level} · ${esc(q.category)}</span><span id="timer" class="timer">--</span></div><div class="q">${esc(q.q)}</div><div class="answers">${q.options.map((o,i)=>`<button class="ans ${sel===i?'sel':''}" data-i="${i}" ${s.hasAnswered||!s.canAnswer?'disabled':''}>${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><div class="between" style="margin-top:12px"><span id="am" class="muted small">${s.hasAnswered?'Respuesta registrada.':'Selecciona una opción.'}</span><button id="send" class="btn primary" ${s.hasAnswered||sel===null||!s.canAnswer?'disabled':''}>Enviar respuesta</button></div></section>`;return `<section class="panel">${header(s)}</section><div style="margin-top:12px">${body}</div><section class="panel" style="margin-top:12px"><h3>Clasificación</h3>${board(s)}</section>`}
function wireHost(){document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>hostAct(b.dataset.act));const c=id('cancel');if(c)c.onclick=cancelT}async function hostAct(a){if(busy)return;busy=true;const f={start_phase:'torneo_start_phase',start_question:'torneo_start_question',close_phase:'torneo_close_phase'}[a];try{await rpc(f,{p_code:code,p_host_token:token});await refresh()}catch(e){const x=id('hm');if(x)x.textContent=e.message}finally{busy=false}}async function cancelT(){if(!confirm('¿Cancelar torneo?'))return;await rpc('torneo_cancel',{p_code:code,p_host_token:token});await refresh()}
function wirePlayer(){document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;document.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('sel',x===b));if(id('send'))id('send').disabled=false});if(id('send'))id('send').onclick=sendA}async function sendA(){if(sel===null||busy)return;busy=true;try{await rpc('torneo_answer',{p_code:code,p_player_token:token,p_answer_index:sel});sel=null;await refresh()}catch(e){if(id('am'))id('am').textContent=e.message}finally{busy=false}}
function startTick(){if(tick)clearInterval(tick);tick=setInterval(()=>{const x=id('timer'),d=state?.tournament?.question_deadline;if(x&&d)x.textContent=Math.max(0,Math.ceil((new Date(d)-Date.now())/1000))+'s'},250)}function leave(){clearTimers();code='';token='';state=null;sel=null;history.replaceState({},'',location.pathname);home('solo')}
</script><script>'use strict';async function boot(){setConn('Servidor listo','ok');const q=norm(new URLSearchParams(location.search).get('code'));if(q.length===6){for(const r of ['host','player']){const t=localStorage.getItem(rk(r,q));if(t){try{code=q;token=t;await enter();return}catch{localStorage.removeItem(rk(r,q))}}}}if(await resumeSolo())return;home('solo')}boot();</script></body></html>
